<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALSF · 内容管理</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6df0'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg:#f5f6f8; --panel:#ffffff; --line:#e3e6ec; --line2:#d4d9e0;
      --text:#1f2329; --dim:#8a919c; --accent:#2f6df0; --accent-soft:#eaf1fe;
      --ok:#16a34a; --danger:#dc2626; --warn:#d97706;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
      font:14px/1.55 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; padding:20px; }
    h1 { font-size:18px; margin:0; }
    .sub { color:var(--dim); font-size:12.5px; margin:2px 0 0; }
    header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
    header .grow { flex:1; }
    .btn { font:inherit; cursor:pointer; background:#fff; color:var(--text);
      border:1px solid var(--line2); border-radius:8px; padding:7px 14px; }
    .btn:hover { border-color:var(--accent); color:var(--accent); }
    .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
    .btn.primary:hover { filter:brightness(1.08); color:#fff; }
    .btn.danger { color:var(--danger); border-color:#f3c1c1; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .layout { display:grid; grid-template-columns:300px 1fr; gap:14px; align-items:start; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
    .tabs { display:flex; gap:6px; margin-bottom:12px; }
    .tab { font:inherit; font-size:13px; cursor:pointer; border:1px solid var(--line2);
      background:#fff; color:var(--dim); border-radius:999px; padding:5px 16px; }
    .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    .list { display:flex; flex-direction:column; gap:6px; max-height:70vh; overflow:auto; }
    .item { display:flex; align-items:center; gap:8px; border:1px solid var(--line);
      border-radius:9px; padding:8px 11px; cursor:pointer; font-size:13.5px; }
    .item:hover { border-color:var(--accent); }
    .item.active { border-color:var(--accent); background:var(--accent-soft); }
    .item .b { font-size:11px; color:var(--dim); border:1px solid var(--line2);
      border-radius:999px; padding:0 7px; }
    .item .b.accent { color:var(--accent); border-color:#bcd2fa; background:#f3f8ff; }
    .item .grow { flex:1; }
    .field { display:block; margin:10px 0; }
    .field > span { display:block; font-size:12.5px; color:var(--dim); margin-bottom:4px; }
    input, select, textarea { font:inherit; color:var(--text); background:#fbfcfe;
      border:1px solid var(--line2); border-radius:8px; padding:7px 10px; }
    input:focus, select:focus, textarea:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
    input[readonly] { color:var(--dim); background:#f1f3f6; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
    .row .field { flex:1; min-width:110px; }
    textarea { width:100%; font:12.5px/1.5 Consolas,monospace; white-space:pre; }
    .skills { display:grid; gap:12px; }
    .skill { border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
    .skill > h4 { margin:0 0 6px; font-size:13.5px; }
    .fx { border:1px dashed var(--line2); border-radius:9px; padding:8px 10px; margin:7px 0; }
    .fx .fxrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .fx .fxrow .field { margin:4px 0; }
    .fx .op-name { font-size:12.5px; font-weight:600; color:var(--accent);
      background:var(--accent-soft); border-radius:6px; padding:2px 9px; }
    .fx .del { margin-left:auto; }
    .fx-raw { width:100%; min-height:52px; }
    .fx-add { display:flex; gap:8px; align-items:center; margin-top:8px; }
    .fx-add select { flex:0 0 auto; max-width:220px; }
    .map-grid { display:grid; gap:2px; margin:10px 0; }
    .cell { width:30px; height:30px; border-radius:4px; border:1px solid var(--line);
      display:grid; place-items:center; font-size:11px; font-weight:700; cursor:pointer;
      background:#fff; color:var(--dim); user-select:none; }
    .cell.water { background:#cfe4f7; border-color:#a9c9e8; }
    .cell.wall { background:#7c8794; border-color:#69737f; }
    .cell.spawn { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
    .cell.heal { background:#e7f8ef; border-color:#9fd8b8; color:var(--ok); }
    .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--dim); }
    .legend i { display:inline-block; width:12px; height:12px; border-radius:3px;
      border:1px solid var(--line2); vertical-align:-1px; margin-right:4px; }
    .status { min-height:20px; font-size:13px; margin:8px 0 0; }
    .status.ok { color:var(--ok); } .status.err { color:var(--danger); }
    [hidden] { display:none !important; }
    .json-toggle { font-size:12.5px; color:var(--dim); background:none; border:none;
      cursor:pointer; text-decoration:underline; padding:0; }
    @media (max-width:860px) { .layout { grid-template-columns:1fr; } .list { max-height:180px; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>全冥星大坐站 · 内容管理</h1>
      <p class="sub">保存后写入 data/catalog.json 并热更，新对局立即生效</p>
    </div>
    <div class="grow"></div>
    <button id="btn-reload" class="btn" type="button">重新载入</button>
    <button id="btn-save" class="btn primary" type="button">保存全部</button>
  </header>

  <div class="layout">
    <div class="panel">
      <div class="tabs">
        <button class="tab active" data-tab="cards" type="button">卡牌</button>
        <button class="tab" data-tab="heroes" type="button">英雄</button>
        <button class="tab" data-tab="maps" type="button">地图</button>
      </div>
      <div class="list" id="item-list"></div>
      <button id="btn-add" class="btn" type="button" style="width:100%;margin-top:10px">＋ 新增</button>
      <button id="btn-del" class="btn danger" type="button" style="width:100%;margin-top:6px">删除选中</button>
    </div>

    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <strong id="editor-title" style="font-size:15px">—</strong>
        <button id="btn-json" class="json-toggle" type="button">JSON 视图</button>
      </div>
      <div id="form-view"></div>
      <div id="json-view" hidden>
        <textarea id="json-editor" rows="22" spellcheck="false"></textarea>
        <button id="btn-json-apply" class="btn" type="button" style="margin-top:8px">应用 JSON 到表单</button>
      </div>
      <p id="status" class="status"></p>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
